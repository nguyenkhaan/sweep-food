[project]
name = "freshcheck-kb"
version = "0.3.0"
description = "Build and validate the versioned FreshCheck knowledge-base artifact."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.25.1",
    "PyYAML>=6.0.2",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.3.5",
    "ruff>=0.11.0",
    "types-PyYAML>=6.0.12.20250915",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
strict = true
