[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cloudian", email = "nguyenkhaan2006@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["src/test"]
python_files = ["test_*.py"]
pythonpath = ["."]
markers = [
    "wiremock: requires the local WireMock service to be running",
]

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, '.')"

[tool.pylint.design]
min-public-methods = 0

[tool.pylint.similarities]
min-similarity-lines = 10

[tool.mypy]
explicit_package_bases = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pylint>=4.0.8",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
