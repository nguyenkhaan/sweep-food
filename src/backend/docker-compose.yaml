name: sweep-food-backend

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      WIREMOCK_URL: http://wiremock:8080
      EMAIL_SMTP_HOST: mailpit
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
      wiremock:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4000/api/health/liveness')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - backend_network

  notification_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["arq", "src.module.notification.notification_worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      WIREMOCK_URL: http://wiremock:8080
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_service_account
    secrets:
      - firebase_service_account
    depends_on:
      redis:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    networks:
      - backend_network

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports: 
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend_network

  wiremock:
    image: wiremock/wiremock:3.13.2
    volumes:
      - ./wiremock:/home/wiremock
    ports:
      - "8000:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/__admin/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend_network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - backend_network

volumes:
  redis_data:
    name: sweep_food_backend_redis_data

secrets:
  firebase_service_account:
    file: ${FIREBASE_SERVICE_ACCOUNT_FILE:-./firebase-service-account.json}

networks:
  backend_network:
    name: sweep_food_backend_network
    driver: bridge
