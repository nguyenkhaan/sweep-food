<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body { margin: 0; background: #f4f7fb; color: #182230; font-family: Arial, sans-serif; }
      .wrapper { padding: 32px 16px; }
      .card { max-width: 560px; margin: 0 auto; overflow: hidden; background: #ffffff; border-radius: 20px; box-shadow: 0 12px 32px rgba(30, 55, 90, 0.12); }
      .header { padding: 28px 32px; background: linear-gradient(135deg, #0d9488, #2563eb); color: #ffffff; }
      .content { padding: 32px; line-height: 1.65; }
      .code { margin: 24px 0; padding: 18px; border-radius: 12px; background: #ecfeff; color: #0f766e; font-size: 30px; font-weight: 700; letter-spacing: 8px; text-align: center; }
      .note { color: #64748b; font-size: 14px; }
      .footer { padding: 20px 32px; border-top: 1px solid #e2e8f0; color: #94a3b8; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <main class="card">
        <header class="header"><strong>Sweep Food</strong></header>
        <section class="content">{% block content %}{% endblock %}</section>
        <footer class="footer">If you did not request this action, you can safely ignore this email.</footer>
      </main>
    </div>
  </body>
</html>
