<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root{--green-700:#40916C;--green-800:#B7E4C7;--green-100:#17301F;--ink:#ECEFEA;--ink-2:#A8ADA4;--ink-3:#7C827A;--line:#2E362F;--fill:#242B25;--bg:#101511;--surface:#1A211C;--soon:#D6B45A;}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
    .screen{width:390px;background:var(--bg);display:flex;flex-direction:column}
    .top{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
    .top .bk{color:var(--ink-2)}
    .top .t{font-size:17px;font-weight:700}
    .list{padding:16px;display:flex;flex-direction:column;gap:10px}
    .row{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
    .row .ic{width:38px;height:38px;flex:none;border-radius:9px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
    .row .bd{flex:1;min-width:0}
    .row .nm{font-size:14px;font-weight:600}
    .row .mt{font-size:12px;color:var(--ink-3);margin-top:2px}
    .row .rs{font-size:12px;color:var(--ink-2);margin-top:2px}
    .row .qt{text-align:right;flex:none}
    .row .qt .d{font-size:14px;font-weight:700}
    .row .qt .d.up{color:var(--green-800)}
    .row .qt .d.dn{color:var(--ink-2)}
    .row .qt .ba{font-size:11px;color:var(--ink-3);margin-top:2px}
  </style>
</helmet>
<div class="screen">
  <div class="top">
    <svg class="bk" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <div class="t">Lịch sử: Ức gà</div>
  </div>
  <div class="list">
    <div class="row">
      <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>
      <div class="bd"><div class="nm">Nhập kho ban đầu</div><div class="mt">12/12/2025 · 09:10</div><div class="rs">Nhập kho ban đầu</div></div>
      <div class="qt"><div class="d up">+300 g</div><div class="ba">0 g → 300 g</div></div>
    </div>
    <div class="row">
      <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M13 6l6 6-6 6"/></svg></span>
      <div class="bd"><div class="nm">Chuyển ngăn bảo quản</div><div class="mt">13/12/2025 · 08:00</div><div class="rs">Ngăn mát → Ngăn đông</div></div>
      <div class="qt"></div>
    </div>
    <div class="row">
      <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg></span>
      <div class="bd"><div class="nm">Trừ kho khi nấu</div><div class="mt">14/12/2025 · 18:30</div><div class="rs">Salad bơ ức gà</div></div>
      <div class="qt"><div class="d dn">−200 g</div><div class="ba">300 g → 100 g</div></div>
    </div>
    <div class="row">
      <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></span>
      <div class="bd"><div class="nm">Đã dùng (thủ công)</div><div class="mt">15/12/2025 · 07:15</div></div>
      <div class="qt"><div class="d dn">−100 g</div><div class="ba">100 g → 0 g</div></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
