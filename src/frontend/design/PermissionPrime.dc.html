<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root{--green-700:#2D6A4F;--green-100:#D8F3DC;--ink:#1A1C19;--ink-2:#5C5F5A;--ink-3:#8A8D87;--line:#E1E3DE;--surface:#FFFFFF;}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
    .screen{width:390px;height:600px;display:flex;flex-direction:column;background:#F8F9FA}
    .scrim{flex:1;background:rgba(20,28,22,.34)}
    .sheet{flex:none;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(20,28,22,.22);padding:20px 22px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
    .grab{width:38px;height:4px;border-radius:999px;background:var(--line)}
    .ic{width:64px;height:64px;border-radius:20px;background:var(--green-100);color:var(--green-700);display:flex;align-items:center;justify-content:center;margin-top:6px}
    .t{font-size:17px;font-weight:700}
    .s{font-size:13px;color:var(--ink-2);line-height:1.55}
    .btns{width:100%;display:flex;flex-direction:column;gap:9px;margin-top:6px}
    .btn{height:48px;border-radius:12px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;border:1px solid transparent}
    .btn.pri{background:var(--green-700);color:#fff}
    .btn.ghost{background:transparent;color:var(--ink-2)}
    .fine{font-size:11px;color:var(--ink-3)}
  </style>
</helmet>
<div class="screen">
  <div class="scrim"></div>
  <div class="sheet">
    <span class="grab"></span>
    <span class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2h6l2 2h3v11H4Z"/><circle cx="12" cy="13" r="3.4"/></svg></span>
    <div class="t">Cho phép dùng máy ảnh</div>
    <div class="s">SweepFood cần máy ảnh để quét tem nhãn và hóa đơn. Ảnh chỉ dùng để trích xuất thông tin nguyên liệu, không lưu lại nếu bạn không xác nhận.</div>
    <div class="btns">
      <button class="btn pri">Cho phép</button>
      <button class="btn ghost">Không phải bây giờ</button>
    </div>
    <div class="fine">Bạn có thể đổi trong Cài đặt bất cứ lúc nào.</div>
  </div>
</div>
</x-dc>
</body>
</html>
