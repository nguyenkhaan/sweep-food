<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root{--green-800:#1B4332;--green-700:#2D6A4F;--green-600:#40916C;--green-100:#D8F3DC;--ink:#1A1C19;--ink-2:#5C5F5A;--ink-3:#8A8D87;--line:#E1E3DE;--fill:#EFF1EC;--bg:#F8F9FA;--surface:#FFFFFF;}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
    a{color:var(--green-700);text-decoration:none}a:hover{color:var(--green-800)}
    .screen{width:390px;background:var(--bg);display:flex;flex-direction:column;padding:16px 24px 28px;min-height:720px}
    .rnd{width:36px;height:36px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink)}
    .head{margin:26px 0 20px}
    .head .t{font-size:25px;font-weight:700;letter-spacing:-.02em}
    .head .s{font-size:14px;color:var(--ink-2);margin-top:6px;line-height:1.5}
    .field{display:flex;flex-direction:column;gap:7px}
    .field label{font-size:12px;font-weight:600;color:var(--ink-2)}
    .input{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 13px;font-size:14px}
    .input .ph{color:var(--ink-3)}
    .btn{height:50px;border-radius:12px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;border:1px solid transparent;background:var(--green-700);color:#fff;margin-top:16px}
    .back{text-align:center;font-size:13px;margin-top:16px}
    .statehint{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:30px 0 10px}
    .sent{background:var(--green-100);border-radius:14px;padding:16px;display:flex;gap:12px}
    .sent .ic{width:36px;height:36px;border-radius:10px;background:var(--surface);color:var(--green-700);display:flex;align-items:center;justify-content:center;flex:none}
    .sent .st{font-size:14px;font-weight:700;color:var(--green-800)}
    .sent .ss{font-size:12px;color:var(--green-800);opacity:.8;margin-top:3px;line-height:1.45}
  </style>
</helmet>
<div class="screen">
  <span class="rnd"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span>

  <div class="head">
    <div class="t">Quên mật khẩu</div>
    <div class="s">Nhập email tài khoản, chúng tôi sẽ gửi liên kết đặt lại mật khẩu.</div>
  </div>

  <div class="field">
    <label>Email</label>
    <div class="input"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8D87" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/></svg><span class="ph">ban@email.com</span></div>
  </div>
  <button class="btn">Gửi liên kết</button>
  <div class="back"><a href="#">Quay lại đăng nhập</a></div>

  <div class="statehint">Sau khi gửi</div>
  <div class="sent">
    <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H4Z"/><path d="M4 7l8 6 8-6"/><path d="M15 15l3 3 4-5" stroke-width="2"/></svg></span>
    <div>
      <div class="st">Đã gửi tới ban@email.com</div>
      <div class="ss">Kiểm tra hộp thư (kể cả mục spam). Liên kết hiệu lực trong 30 phút.</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
