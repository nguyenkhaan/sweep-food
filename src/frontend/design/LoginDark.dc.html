<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root{--green-800:#B7E4C7;--green-700:#40916C;--green-600:#52B788;--green-100:#17301F;--ink:#ECEFEA;--ink-2:#A8ADA4;--ink-3:#7C827A;--line:#2E362F;--fill:#242B25;--bg:#101511;--surface:#1A211C;}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
    a{color:var(--green-800);text-decoration:none}a:hover{color:var(--green-600)}
    .screen{width:390px;background:var(--bg);display:flex;flex-direction:column;padding:16px 24px 28px;min-height:780px}
    .rnd{width:36px;height:36px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink)}
    .head{margin:26px 0 22px}
    .head .t{font-size:26px;font-weight:700;letter-spacing:-.02em}
    .head .s{font-size:14px;color:var(--ink-2);margin-top:6px}
    .form{display:flex;flex-direction:column;gap:14px}
    .field{display:flex;flex-direction:column;gap:7px}
    .field label{font-size:12px;font-weight:600;color:var(--ink-2)}
    .input{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 13px;font-size:14px}
    .input .val{color:var(--ink)}
    .input .ph{color:var(--ink-3)}
    .input .eye{margin-left:auto;color:var(--ink-3)}
    .forgot{align-self:flex-end;font-size:12px;font-weight:600}
    .btn{height:50px;border-radius:12px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent}
    .btn.pri{background:var(--green-700);color:#fff;margin-top:4px}
    .btn.out{background:var(--surface);border-color:var(--line);color:var(--ink)}
    .divider{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:12px;margin:18px 0}
    .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
    .foot{margin-top:auto;text-align:center;font-size:13px;color:var(--ink-2);padding-top:22px}
    .foot a{font-weight:600}
  </style>
</helmet>
<div class="screen">
  <span class="rnd"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span>

  <div class="head">
    <div class="t">Đăng nhập</div>
    <div class="s">Tiếp tục quản lý tủ bếp của bạn</div>
  </div>

  <div class="form">
    <div class="field">
      <label>Email</label>
      <div class="input"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7C827A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/></svg><span class="val">alex@email.com</span></div>
    </div>
    <div class="field">
      <label>Mật khẩu</label>
      <div class="input"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7C827A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span class="ph">••••••••</span><span class="eye"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></span></div>
    </div>
    <a class="forgot" href="#">Quên mật khẩu?</a>
    <button class="btn pri">Đăng nhập</button>
  </div>

  <div class="divider">hoặc</div>
  <button class="btn out">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7C827A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
    Tiếp tục với Google
  </button>

  <div class="foot">Chưa có tài khoản? <a href="#">Đăng ký</a></div>
</div>
</x-dc>
</body>
</html>
