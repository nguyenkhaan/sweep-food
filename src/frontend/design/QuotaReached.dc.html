<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root{--green-700:#2D6A4F;--green-100:#D8F3DC;--ink:#1A1C19;--ink-2:#5C5F5A;--ink-3:#8A8D87;--line:#E1E3DE;--fill:#EFF1EC;--surface:#FFFFFF;}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
    .screen{width:390px;height:600px;background:#F8F9FA;display:flex;align-items:center;justify-content:center;padding:24px}
    .scrim{position:absolute;inset:0;background:rgba(20,28,22,.4)}
    .card{position:relative;background:var(--surface);border-radius:20px;padding:24px 22px;text-align:center;box-shadow:0 20px 50px rgba(20,28,22,.28);max-width:320px}
    .ic{width:56px;height:56px;border-radius:16px;background:var(--fill);color:var(--ink-2);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
    .t{font-size:17px;font-weight:700}
    .s{font-size:13px;color:var(--ink-2);line-height:1.5;margin:8px 0 18px}
    .btns{display:flex;flex-direction:column;gap:9px}
    .btn{height:46px;border-radius:12px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;border:1px solid transparent}
    .btn.pri{background:var(--green-700);color:#fff}
    .btn.ghost{background:transparent;color:var(--ink-2)}
  </style>
</helmet>
<div class="screen">
  <div class="scrim"></div>
  <div class="card">
    <span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
    <div class="t">Đã dùng hết 10 lượt quét</div>
    <div class="s">Bạn đã dùng hết lượt quét miễn phí trong tháng này. Nâng cấp Premium để quét không giới hạn, hoặc thêm bằng cách nhập tay.</div>
    <div class="btns">
      <button class="btn pri">Nâng cấp Premium</button>
      <button class="btn ghost">Nhập tay</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
