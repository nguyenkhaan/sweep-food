<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root{--green-700:#40916C;--green-100:#17301F;--ink:#ECEFEA;--ink-2:#A8ADA4;--ink-3:#7C827A;--line:#2E362F;--fill:#242B25;--surface:#1A211C;--brick-100:#33211F;--brick-500:#C99A9B;}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
    .screen{width:390px;height:620px;display:flex;flex-direction:column;background:#101511}
    .scrim{flex:1;background:rgba(0,0,0,.58)}
    .sheet{flex:none;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.55);padding:14px 20px 22px;display:flex;flex-direction:column;gap:14px}
    .grab{width:38px;height:4px;border-radius:999px;background:var(--line);align-self:center}
    .tt{font-size:17px;font-weight:700}
    .st{font-size:12px;color:var(--ink-3);margin-top:-8px}
    .row{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
    .row .lb{font-size:13px;font-weight:600}
    .row .stp{display:flex;align-items:center;gap:14px}
    .row .b{width:28px;height:28px;border-radius:8px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--ink-2)}
    .row .v{font-size:14px;font-weight:700}
    .row .sel{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
    .info{display:flex;gap:9px;align-items:flex-start;background:var(--brick-100);color:var(--brick-500);border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.45}
    .btns{display:flex;gap:10px}
    .btn{flex:1;height:48px;border-radius:12px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;border:1px solid transparent}
    .btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink-2)}
    .btn.pri{background:var(--green-700);color:#fff}
  </style>
</helmet>
<div class="screen">
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="tt">Còn dư món ăn?</div>
    <div class="st">Lưu phần còn lại vào kho (tầng Ăn liền) và đặt nhắc dùng sớm.</div>

    <div class="row">
      <span class="lb">Số khẩu phần còn</span>
      <span class="stp"><span class="b">−</span><span class="v">1 phần</span><span class="b">+</span></span>
    </div>
    <div class="row">
      <span class="lb">Nhắc dùng</span>
      <span class="sel">Sau 2 ngày <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
    </div>

    <div class="info">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/><path d="M12 8h.01"/><path d="M12 11v5"/></svg>
      Thức ăn đã nấu nên dùng trong 1–2 ngày. Kiểm tra mùi và trạng thái trước khi ăn.
    </div>

    <div class="btns">
      <button class="btn ghost">Bỏ qua</button>
      <button class="btn pri">Lưu phần thừa</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
