<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root{
      --green-800:#B7E4C7;--green-700:#40916C;--green-600:#52B788;--green-300:#74C69D;--green-100:#17301F;
      --brick-500:#C99A9B;--brick-100:#33211F;
      --ink:#ECEFEA;--ink-2:#A8ADA4;--ink-3:#7C827A;
      --line:#2E362F;--fill:#242B25;--bg:#101511;--surface:#1A211C;
      --crit:#E08A5C;--crit-bg:#352017;--soon:#D6B45A;--soon-bg:#312B16;
      --exp:#D9A7A8;--exp-bg:#33211F;--ok:#A8ADA4;--ok-bg:#242B25;
      --e1:0 1px 2px rgba(0,0,0,.4);--e3:0 10px 26px rgba(0,0,0,.55);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
    a{color:var(--green-300);text-decoration:none}a:hover{color:var(--green-600)}
    .screen{width:390px;background:var(--bg);display:flex;flex-direction:column;position:relative}
    .topbar{display:flex;align-items:center;gap:10px;padding:14px 18px}
    .topbar h1{font-size:18px;font-weight:700;margin:0}
    .topbar .sp{flex:1}
    .rnd{width:36px;height:36px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
    .content{padding:4px 20px 28px;display:flex;flex-direction:column;gap:18px}
    .field{display:flex;flex-direction:column;gap:7px}
    .field label{font-size:12px;font-weight:600;color:var(--ink-2)}
    .field label .opt{color:var(--ink-3);font-weight:500}
    .input,.select{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:9px;padding:0 13px;font-size:14px}
    .input .ph{color:var(--ink-3)}
    .input .suffix{margin-left:auto;color:var(--ink-3)}
    .select{justify-content:space-between;color:var(--ink)}
    .select .muted{color:var(--ink-3)}
    .chiprow{display:flex;flex-wrap:wrap;gap:7px}
    .chip{height:30px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:inline-flex;align-items:center}
    .row2{display:flex;gap:12px}
    .stepper{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:0 6px}
    .sbtn{width:34px;height:34px;border-radius:9px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:var(--ink-2)}
    .sval{font-size:15px;font-weight:700}
    .tiergrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .topt{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-2)}
    .topt.on{border-color:var(--green-700);background:var(--green-100);color:var(--green-800)}
    .hint{display:flex;gap:9px;align-items:flex-start;background:var(--soon-bg);color:#D6B45A;border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.45}
    .hint svg{flex:none;margin-top:1px}
    .savebar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(0,0,0,.4);padding:12px 20px 18px}
    .btn{width:100%;height:50px;border-radius:12px;font-size:15px;font-weight:600;border:1px solid transparent;display:flex;align-items:center;justify-content:center}
    .btn.pri{background:var(--green-700);color:#fff}
  </style>
</helmet>
<div class="screen">
  <div class="topbar">
    <span class="rnd"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg></span>
    <h1>Thêm nguyên liệu</h1>
    <span class="sp"></span>
  </div>

  <div class="content">
    <div class="field">
      <label>Tên nguyên liệu</label>
      <div class="input">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7C827A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14Z"/><path d="M20 20l-4-4"/></svg>
        <span class="ph">VD: Cà chua bi</span>
      </div>
      <div class="chiprow">
        <span class="chip">Cà chua bi</span>
        <span class="chip">Trứng gà</span>
        <span class="chip">Hành lá</span>
        <span class="chip">Thịt ba chỉ</span>
      </div>
    </div>

    <div class="field">
      <label>Danh mục</label>
      <div class="select">Rau củ <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7C827A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
    </div>

    <div class="row2">
      <div class="field" style="flex:1">
        <label>Số lượng</label>
        <div class="stepper"><span class="sbtn">−</span><span class="sval">500</span><span class="sbtn">+</span></div>
      </div>
      <div class="field" style="width:116px">
        <label>Đơn vị</label>
        <div class="select">g <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7C827A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
      </div>
    </div>

    <div class="field">
      <label>Tầng bảo quản</label>
      <div class="tiergrid">
        <span class="topt"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 5 6 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5-1-9Z"/></svg>Ăn liền</span>
        <span class="topt on"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M6 11h12"/></svg>Ngăn mát</span>
        <span class="topt"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M4.5 7.5 19.5 16.5"/><path d="M19.5 7.5 4.5 16.5"/></svg>Ngăn đông</span>
        <span class="topt"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8"/><path d="M9 3v3l-1 2v11a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V8l-1-2V3"/></svg>Kệ đồ khô</span>
      </div>
    </div>

    <div class="row2">
      <div class="field" style="flex:1">
        <label>Ngày đóng gói</label>
        <div class="select"><span class="muted">Chọn ngày</span> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7C827A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M4 11h16"/></svg></div>
      </div>
      <div class="field" style="flex:1">
        <label>Hạn sử dụng</label>
        <div class="select">12/09/2026 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7C827A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M4 11h16"/></svg></div>
      </div>
    </div>

    <div class="hint">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
      Rau ăn lá trong ngăn mát nên dùng trong 3–5 ngày. Đặt hạn sử dụng để nhận nhắc kịp thời.
    </div>

    <div class="field">
      <label>Giá mua <span class="opt">(tùy chọn)</span></label>
      <div class="input"><span class="ph">0</span><span class="suffix">đ</span></div>
    </div>
  </div>

  <div class="savebar">
    <button class="btn pri">Thêm vào kho</button>
  </div>
</div>
</x-dc>
</body>
</html>
