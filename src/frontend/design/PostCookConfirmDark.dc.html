<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root{--green-700:#40916C;--green-100:#17301F;--green-800:#B7E4C7;--ink:#ECEFEA;--ink-2:#A8ADA4;--ink-3:#7C827A;--line:#2E362F;--fill:#242B25;--surface:#1A211C;}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
    .screen{width:390px;height:660px;display:flex;flex-direction:column;background:#101511}
    .scrim{flex:1;background:rgba(0,0,0,.58)}
    .sheet{flex:none;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.55);padding:14px 20px 22px;display:flex;flex-direction:column;gap:6px}
    .grab{width:38px;height:4px;border-radius:999px;background:var(--line);align-self:center;margin-bottom:8px}
    .tt{font-size:17px;font-weight:700}
    .st{font-size:12px;color:var(--ink-3);margin:2px 0 10px}
    .opt{display:flex;align-items:center;gap:13px;padding:14px 4px;border-bottom:1px solid var(--fill)}
    .opt:last-child{border-bottom:0}
    .opt .ic{width:34px;height:34px;border-radius:10px;background:var(--green-100);color:var(--green-800);display:flex;align-items:center;justify-content:center;flex:none}
    .opt .lb{font-size:14px;font-weight:600}
    .opt .ds{font-size:11px;color:var(--ink-3);margin-top:1px}
    .opt .rec{font-size:10px;font-weight:700;color:var(--green-800);background:var(--green-100);border-radius:999px;padding:2px 7px}
    .opt .chev{margin-left:auto;color:var(--ink-3);flex:none}
  </style>
</helmet>
<div class="screen">
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="tt">Bạn đã nấu &ldquo;Salad bơ ức gà&rdquo;?</div>
    <div class="st">Chọn lượng nguyên liệu đã dùng để cập nhật kho</div>

    <div class="opt">
      <span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg></span>
      <div><div class="lb">Dùng đúng định lượng <span class="rec">Gợi ý</span></div><div class="ds">Trừ kho theo công thức (2 phần)</div></div>
      <span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
    </div>
    <div class="opt">
      <span class="ic" style="font-weight:700;font-size:13px">½</span>
      <div><div class="lb">Dùng một nửa</div><div class="ds">Trừ 50% lượng dự kiến</div></div>
      <span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
    </div>
    <div class="opt">
      <span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12"/><path d="M8 7v12h8V7"/><path d="M10 11v4"/><path d="M14 11v4"/></svg></span>
      <div><div class="lb">Dùng hết những gì đang có</div><div class="ds">Đưa các nguyên liệu này về 0</div></div>
      <span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
    </div>
    <div class="opt">
      <span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h12"/><path d="M9 8l-3 4 3 4"/><path d="M15 8l3 4-3 4"/></svg></span>
      <div><div class="lb">Tự điều chỉnh</div><div class="ds">Chỉnh từng nguyên liệu</div></div>
      <span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
