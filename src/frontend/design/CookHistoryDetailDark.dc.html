<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root{--green-700:#40916C;--ink:#ECEFEA;--ink-2:#A8ADA4;--ink-3:#7C827A;--line:#2E362F;--fill:#242B25;--bg:#101511;--surface:#1A211C;}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
    .screen{width:390px;background:var(--bg);display:flex;flex-direction:column}
    .top{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
    .top .bk{color:var(--ink-2)}
    .top .t{font-size:17px;font-weight:700}
    .content{padding:20px;display:flex;flex-direction:column;gap:18px}
    .h1{font-size:21px;font-weight:700}
    .sub{font-size:13px;color:var(--ink-2);margin-top:2px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px}
    .irow{display:flex;padding:11px 0;font-size:14px;border-bottom:1px solid var(--fill)}
    .irow:last-child{border-bottom:0}
    .irow .k{color:var(--ink-2);flex:1}
    .irow .v{font-weight:600}
    .sh{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--ink-3)}
    .drow{display:flex;align-items:center;padding:12px 16px;font-size:14px;border-bottom:1px solid var(--fill)}
    .drow:last-child{border-bottom:0}
    .drow .nm{flex:1}
    .drow .q{font-weight:700}
  </style>
</helmet>
<div class="screen">
  <div class="top">
    <svg class="bk" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <div class="t">Chi tiết phiên nấu</div>
  </div>
  <div class="content">
    <div>
      <div class="h1">Salad bơ ức gà</div>
      <div class="sub">Đã nấu</div>
    </div>

    <div class="card">
      <div class="irow"><span class="k">Số phần</span><span class="v">2</span></div>
      <div class="irow"><span class="k">Hoàn tất lúc</span><span class="v">12/12/2025 · 18:30</span></div>
      <div class="irow"><span class="k">Cách trừ kho</span><span class="v">Đúng định lượng</span></div>
      <div class="irow"><span class="k">Món ăn thừa đã lưu</span><span class="v">Không</span></div>
    </div>

    <div class="sh">NGUYÊN LIỆU ĐÃ TRỪ</div>
    <div class="card" style="padding:0">
      <div class="drow"><span class="nm">Lô kho …a3f9c1</span><span class="q">− 200 g</span></div>
      <div class="drow"><span class="nm">Lô kho …b8e204</span><span class="q">− 100 g</span></div>
      <div class="drow"><span class="nm">Lô kho …c1d770</span><span class="q">− 1 quả</span></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
