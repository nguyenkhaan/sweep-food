name: frontend
description: "SweepFood - Trợ lý quản lý nguyên liệu và gợi ý bữa ăn thông minh"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

# NOTE: versions left loose (`any`) for the scaffold phase; pubspec.lock pins the
# resolved set. Tighten to caret ranges once the stack is exercised (plan.md §3).

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI (Riverpod)
  flutter_riverpod: any
  riverpod_annotation: any

  # Routing
  go_router: any

  # Networking
  dio: any

  # Models / functional
  freezed_annotation: any
  json_annotation: any
  fpdart: any

  # Local storage
  shared_preferences: any
  flutter_secure_storage: any

  # Media / multimodal input
  image_picker: any
  image_cropper: any
  permission_handler: any
  path_provider: any
  # record: any            # voice capture — enable when wiring I-06
  # just_audio: any        # playback preview for voice review

  # Notifications
  flutter_local_notifications: any
  # firebase_core: any     # enable after `flutterfire configure`
  # firebase_messaging: any

  # UI & charts
  flutter_svg: any
  cached_network_image: any
  fl_chart: any
  intl: any

  # Utilities
  logger: any
  connectivity_plus: any
  package_info_plus: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Codegen
  build_runner: any
  riverpod_generator: any
  freezed: any
  json_serializable: any

  # Lints
  flutter_lints: any
  custom_lint: any
  riverpod_lint: any

  # Testing
  mocktail: any

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/mock/
