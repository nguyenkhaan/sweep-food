# Keep Android builds within a typical developer-machine memory budget. The
# previous 8 GiB heap plus 4 GiB metaspace could exhaust the Windows page file.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# Kotlin 2.4.0 incremental compilation fails to close its .tab cache files on
# Windows ("Could not close incremental caches"). Disable it — plugin modules
# are small, so full recompiles are cheap.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
